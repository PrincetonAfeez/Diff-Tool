schema_name: diff_result
schema_version: 1.0
type: object
python_model: diff_tool.models.DiffResult

fields:
  edits:
    type: tuple[Edit]
    description: Ordered edit script.
  hunks:
    type: tuple[Hunk]
    description: Context-grouped edit hunks for unified output.
  stats:
    type: DiffStats
    description: Summary counts and similarity score.
  options:
    type: DiffOptions
    description: Options used to create the result.
  old_line_count:
    type: integer
    description: Raw old-side input line count.
  new_line_count:
    type: integer
    description: Raw new-side input line count.
  has_changes:
    type: boolean
    computed: true
    description: True when insert_count or delete_count is greater than zero.
